name: GOVERNANCE_WEEKLY_REPORT
on:
  schedule:
    # UTC midnight Monday, UTC week boundary -- same fix/reason as the daily
    # workflow (dipankarsarkar, 2026-08-26, symmetric): a fixed Israel-local
    # cron duplicates or skips a report at the DST transitions.
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  weekly_report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate report for the ISO week that just closed (UTC)
        run: |
          WEEK="$(date -u -d 'last week' +%G-W%V)"
          bash scripts/weekly_governance_report.sh "$WEEK"

      - name: Commit report
        run: |
          git config user.name "payton-ci"
          git config user.email "payton-ci@users.noreply.github.com"
          git add REPORTS/
          git commit -m "governance: weekly report $(date -u -d 'last week' +%G-W%V)" || exit 0
          git push
