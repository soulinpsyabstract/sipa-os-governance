name: GOVERNANCE_DAILY_REPORT
on:
  schedule:
    # UTC midnight, UTC day boundary -- switched from Israel-local labeling
    # 2026-08-26 (dipankarsarkar, second review round). A fixed Israel-local
    # cron duplicates one report and skips another every year at the DST
    # transitions; UTC has no transition to get wrong. See
    # scripts/daily_governance_report.sh header for the worked dates.
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily_report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed -- the report reads git log for the whole day

      - name: Generate report for the day that just closed (UTC)
        run: |
          DAY="$(date -u -d 'yesterday' +%F)"
          bash scripts/daily_governance_report.sh "$DAY"

      - name: Commit report
        run: |
          git config user.name "payton-ci"
          git config user.email "payton-ci@users.noreply.github.com"
          git add REPORTS/
          git commit -m "governance: daily report $(date -u -d 'yesterday' +%F)" || exit 0
          git push
