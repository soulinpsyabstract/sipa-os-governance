name: GOVERNANCE_DAILY_REPORT
on:
  schedule:
    # UTC midnight (dipankarsarkar, 2026-08-27, third review round, flagged
    # this slot as the most oversubscribed on GitHub Actions -- measured
    # 7h47m actual delay on its first occurrence, 2026-08-27). Considered and
    # rejected moving this to a non-top-of-hour time (e.g. 20:00 UTC): DAY
    # was still being computed as `date -u -d yesterday` relative to actual
    # run time, and 00:00 UTC gives the LARGEST possible margin against that
    # (~24h) before a delay crosses into the next calendar day and mislabels
    # or skips a day -- moving the trigger later in the day would only
    # shrink that margin (checked against today's actual 7h47m delay: a
    # 20:00-UTC trigger would have finished at 03:47 UTC the next day,
    # crossing the boundary and reproducing the exact failure being fixed).
    # Kept at 00:00 UTC; the real fix is that DAY no longer depends on run
    # time at all -- see scripts/daily_governance_report.sh header.
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily_report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed -- the report reads git log for the whole day

      - name: Install git hooks
        # dipankarsarkar, round 7: actions/checkout gives an empty
        # .git/hooks/ -- install-hooks.sh never ran here, so every
        # payton-ci commit (the highest-volume commit path in the repo)
        # was ungated. Currently benign by his own check (0 citations
        # resolve into REPORTS/, and REPORTS/ is all these commits ever
        # touch) -- but latent, not a reason to leave it uninstalled.
        run: bash scripts/install-hooks.sh

      - name: Generate report for the day that just closed (UTC)
        # No explicit DAY argument (dipankarsarkar, 2026-08-27, third round):
        # passing `date -u -d yesterday` here would silently override the
        # script's own INDEX.tsv-based derivation with the exact run-time-
        # relative computation that fix replaces -- the argument always wins
        # over the default inside the script, so the fix does nothing here
        # unless this step also stops computing DAY itself.
        run: bash scripts/daily_governance_report.sh

      - name: Commit report
        run: |
          git config user.name "payton-ci"
          git config user.email "payton-ci@users.noreply.github.com"
          DAY="$(awk -F'\t' '$1=="daily"{d=$2} END{print d}' REPORTS/INDEX.tsv)"
          git add REPORTS/
          # dipankarsarkar, round 7: `|| exit 0` here can't tell "nothing
          # to commit" apart from "the hook just rejected this commit" --
          # both make `git commit` exit nonzero, both got silently turned
          # into a green run. Check the actual condition first instead of
          # papering over whatever made the exit code nonzero.
          if git diff --cached --quiet; then
            echo "Nothing to commit (report unchanged)."
            exit 0
          fi
          git commit -m "governance: daily report ${DAY}"
          git push
